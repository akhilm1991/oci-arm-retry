name: Toronto Setup
on:
  workflow_dispatch:
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Install OCI CLI
        run: pip install oci-cli --quiet
      - name: Configure OCI Toronto
        env:
          OCI_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_USER: ${{ secrets.OCI_USER_OCID }}
          OCI_FP: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
        run: |
          mkdir -p ~/.oci
          printf '%s' "$OCI_KEY" > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem
          printf '[DEFAULT]
user=%s
fingerprint=%s
tenancy=%s
region=ca-toronto-1
key_file=%s
'             "$OCI_USER" "$OCI_FP" "$OCI_TENANCY" ~/.oci/key.pem > ~/.oci/config
      - name: Get Toronto info
        env:
          OCI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
        run: |
          set +e
          echo === Subscribed regions ===
          oci iam region-subscription list --tenancy-id "$OCI_TENANCY" --output table 2>&1
          echo === Availability domains ===
          oci iam availability-domain list --compartment-id "$OCI_TENANCY" --output table 2>&1
          echo === Ubuntu ARM image ===
          oci compute image list --compartment-id "$OCI_TENANCY" --operating-system "Canonical Ubuntu" --operating-system-version "22.04" --shape VM.Standard.A1.Flex --sort-by TIMECREATED --sort-order DESC --limit 1 --output table 2>&1
