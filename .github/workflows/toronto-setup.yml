name: Toronto Setup (run once)
on:
  workflow_dispatch:
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Install OCI CLI
        run: pip install oci-cli --quiet
      - name: Configure OCI (Toronto)
        run: |
          mkdir -p ~/.oci
          printf '%s' '${{ secrets.OCI_PRIVATE_KEY }}' > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem
          cat > ~/.oci/config << EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=ca-toronto-1
          key_file=$HOME/.oci/key.pem
          EOF
      - name: Check region subscription and create networking
        run: |
          set +e
          COMPARTMENT="${{ secrets.OCI_TENANCY_OCID }}"

          echo "=== Checking region subscription ==="
          oci iam region-subscription list --tenancy-id "$COMPARTMENT" 2>&1 | python3 -c "
import sys, json
try:
    data = json.load(sys.stdin)
    for r in data.get('data', []):
        print(r['region-name'], r['status'])
except:
    print(sys.stdin.read())
" || true

          echo "=== Creating VCN ==="
          VCN_ID=$(oci network vcn create \
            --compartment-id "$COMPARTMENT" \
            --cidr-block 10.0.0.0/16 \
            --display-name trading-bot-vcn \
            --dns-label tradingbot \
            --query "data.id" --raw-output 2>&1)
          echo "VCN result: $VCN_ID"

          echo "=== Listing ADs ==="
          oci iam availability-domain list \
            --compartment-id "$COMPARTMENT" 2>&1
