name: Toronto Setup (run once)
on:
  workflow_dispatch:
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Install OCI CLI
        run: pip install oci-cli --quiet
      - name: Configure OCI (Toronto)
        run: |
          mkdir -p ~/.oci
          printf '%s' '${{ secrets.OCI_PRIVATE_KEY }}' > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem
          cat > ~/.oci/config << EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=ca-toronto-1
          key_file=$HOME/.oci/key.pem
          EOF
      - name: Create Toronto networking
        run: |
          set +e
          COMPARTMENT="${{ secrets.OCI_TENANCY_OCID }}"

          # Create VCN
          echo "Creating VCN..."
          VCN_ID=$(oci network vcn create \
            --compartment-id "$COMPARTMENT" \
            --cidr-block 10.0.0.0/16 \
            --display-name trading-bot-vcn \
            --dns-label tradingbot \
            --query "data.id" --raw-output 2>/dev/null)
          echo "VCN: $VCN_ID"

          # Internet gateway
          IGW_ID=$(oci network internet-gateway create \
            --compartment-id "$COMPARTMENT" \
            --vcn-id "$VCN_ID" \
            --is-enabled true \
            --display-name trading-bot-igw \
            --query "data.id" --raw-output 2>/dev/null)
          echo "IGW: $IGW_ID"

          # Default route table — add route to IGW
          RT_ID=$(oci network route-table list \
            --compartment-id "$COMPARTMENT" \
            --vcn-id "$VCN_ID" \
            --query "data[0].id" --raw-output 2>/dev/null)
          oci network route-table update \
            --rt-id "$RT_ID" \
            --route-rules "[{\"destination\":\"0.0.0.0/0\",\"networkEntityId\":\"$IGW_ID\"}]" \
            --force > /dev/null 2>&1
          echo "Route table updated: $RT_ID"

          # Security list — allow SSH inbound + all outbound
          SL_ID=$(oci network security-list list \
            --compartment-id "$COMPARTMENT" \
            --vcn-id "$VCN_ID" \
            --query "data[0].id" --raw-output 2>/dev/null)
          oci network security-list update \
            --security-list-id "$SL_ID" \
            --ingress-security-rules '[{"source":"0.0.0.0/0","protocol":"6","tcpOptions":{"destinationPortRange":{"min":22,"max":22}}}]' \
            --egress-security-rules '[{"destination":"0.0.0.0/0","protocol":"all"}]' \
            --force > /dev/null 2>&1
          echo "Security list updated: $SL_ID"

          # Subnet
          SUBNET_ID=$(oci network subnet create \
            --compartment-id "$COMPARTMENT" \
            --vcn-id "$VCN_ID" \
            --cidr-block 10.0.0.0/24 \
            --display-name botsubnet \
            --dns-label botsubnet \
            --route-table-id "$RT_ID" \
            --security-list-ids "[\"$SL_ID\"]" \
            --query "data.id" --raw-output 2>/dev/null)
          echo "Subnet: $SUBNET_ID"

          # Ubuntu 22.04 ARM image for Toronto
          IMAGE_ID=$(oci compute image list \
            --compartment-id "$COMPARTMENT" \
            --operating-system "Canonical Ubuntu" \
            --operating-system-version "22.04" \
            --shape "VM.Standard.A1.Flex" \
            --sort-by TIMECREATED --sort-order DESC \
            --query "data[0].id" --raw-output 2>/dev/null)
          echo "Ubuntu ARM image: $IMAGE_ID"

          # AD names
          echo "Availability domains:"
          oci iam availability-domain list \
            --compartment-id "$COMPARTMENT" \
            --query "data[*].name" --raw-output 2>/dev/null

          echo "---"
          echo "SUBNET_ID=$SUBNET_ID"
          echo "IMAGE_ID=$IMAGE_ID"
