name: OCI ARM Retry
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  create-instance:
    runs-on: ubuntu-latest
    steps:
      - name: Install OCI CLI
        run: pip install oci-cli --quiet

      - name: Configure OCI
        run: |
          mkdir -p ~/.oci
          printf '%s' '${{ secrets.OCI_PRIVATE_KEY }}' > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem
          cat > ~/.oci/config << EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=us-ashburn-1
          key_file=$HOME/.oci/key.pem
          EOF

      - name: Check if already running
        id: check
        run: |
          COUNT=$(oci compute instance list \
            --compartment-id ${{ secrets.OCI_TENANCY_OCID }} \
            --display-name trading-bot \
            --lifecycle-state RUNNING \
            --query "length(data)" --raw-output 2>/dev/null || echo "0")
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "Existing running instances: $COUNT"

      - name: Try all ADs
        if: steps.check.outputs.count == '0'
        run: |
          set +e
          SUBNET="ocid1.subnet.oc1.iad.aaaaaaaal3biypdof4bydty32oauen3sv5y22s2nos4zkdb3o2cgghyx5u4a"
          IMAGE="ocid1.image.oc1.iad.aaaaaaaac6tdovnommp6drirew5jopyjtug266lwt543yh37q4ngxebzkc7q"
          printf '%s\n' '${{ secrets.SSH_PUBLIC_KEY }}' > /tmp/ssh_key.pub

          for AD in "KOSs:US-ASHBURN-AD-1" "KOSs:US-ASHBURN-AD-2" "KOSs:US-ASHBURN-AD-3"; do
            echo "Trying $AD..."
            OUT=$(oci compute instance launch \
              --compartment-id ${{ secrets.OCI_TENANCY_OCID }} \
              --availability-domain "$AD" \
              --shape VM.Standard.A1.Flex \
              --shape-config '{"ocpus":2,"memoryInGBs":12}' \
              --image-id "$IMAGE" \
              --subnet-id "$SUBNET" \
              --assign-public-ip true \
              --ssh-authorized-keys-file /tmp/ssh_key.pub \
              --display-name trading-bot 2>&1)
            RC=$?
            if [ $RC -eq 0 ] && echo "$OUT" | grep -q "ocid1.instance"; then
              echo "SUCCESS!"
              echo "$OUT" | python3 -c "import sys,json; d=json.load(sys.stdin)['data']; print('IP:', d.get('public-ip','pending'))"
              exit 0
            fi
            echo "$AD failed: $(echo "$OUT" | head -3)"
          done
          echo "All ADs at capacity — retrying in 10 min"
